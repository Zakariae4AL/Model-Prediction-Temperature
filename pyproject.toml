[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tempforecast"
version = "2.0.0"
description = "Forecast the next 7 days of temperature in Marrakech from 26 years of real weather data"
readme = "README.md"
license = "MIT"
authors = [{ name = "Zakariae" }]
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.40", "altair>=5"]
notebook = ["matplotlib>=3.8", "jupyter"]
dev = ["pytest>=8", "ruff>=0.6", "matplotlib>=3.8", "streamlit>=1.40", "altair>=5"]

[project.scripts]
tempforecast = "tempforecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.format]
exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
